<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دنیای ویدیو</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #02020b;
    color: white;
    font-family: Tahoma, sans-serif;
    min-height: 100vh;
}

#stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: shine 2s infinite alternate;
}

@keyframes shine {
    from { opacity: .2; }
    to { opacity: 1; }
}

main {
    position: relative;
    z-index: 1;
}

header {
    text-align: center;
    padding: 65px 15px 35px;
}

header h1 {
    font-size: 38px;
    text-shadow: 0 0 20px #008cff;
}

header p {
    margin-top: 15px;
    color: #aaa;
}

.card {
    width: 90%;
    max-width: 850px;
    margin: 25px auto;
    padding: 25px;
    background: rgba(15,15,35,.95);
    border: 1px solid #244a91;
    border-radius: 18px;
    box-shadow: 0 0 25px #003b7b55;
}

.card h2 {
    text-align: center;
    color: #00c3ff;
    margin-bottom: 25px;
}

video {
    display: block;
    width: 100%;
    border-radius: 12px;
    background: black;
}

/* دکمه مربعی پخش */

.play-button {
    display: block;
    width: 65px;
    height: 65px;
    margin: 22px auto 0;
    border: 1px solid #00c3ff;
    border-radius: 15px;
    background: linear-gradient(135deg,#006eff,#8300ff);
    color: white;
    font-size: 25px;
    cursor: pointer;
    box-shadow: 0 0 20px #006eff66;
}

.play-button:hover {
    transform: scale(1.08);
}

/* سازندگان */

.credit {
    padding: 17px;
    margin: 12px 0;
    background: #ffffff0a;
    border-right: 3px solid #008cff;
    border-radius: 9px;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
}

</style>
</head>

<body>

<div id="stars"></div>

<main>

<header>

<h1>🌌 دنیای ویدیو 🌌</h1>

<p>به دنیای کهکشان راه شیری خوش آمدید!</p>

</header>

<section class="card">

<h2>🎬 تماشای ویدیو</h2>

<video
    id="player"
    playsinline
    preload="metadata"
>
    <source src="VIDEO-LINK.mp4" type="video/mp4">
    مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
</video>

<button class="play-button" id="playButton" aria-label="پخش ویدیو">
    ▶
</button>

</section>

<section class="card">

<h2>⭐ سازندگان سایت ⭐</h2>

<div class="credit">
👨‍💻 سازنده سایت : معین باقری
</div>

<div class="credit">
🎨 طراح ویدیو : متین باقری
</div>

<div class="credit">
💻 سازنده ویدیو : متین باقری
</div>

<div class="credit">
🎧 صدابرداری : متین باقری
</div>

</section>

<footer>
ساخته شده برای علاقه مندان کهکشان راه شیری
</footer>

</main>

<script>

/* ستاره ها */

const stars = document.getElementById("stars");

for (let i = 0; i < 180; i++) {

    const star = document.createElement("div");

    star.className = "star";

    let size = Math.random() * 3 + 1;

    star.style.width = size + "px";
    star.style.height = size + "px";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";

    star.style.animationDuration =
        (Math.random() * 3 + 1) + "s";

    stars.appendChild(star);

}


/* کنترل پخش ویدیو */

const video = document.getElementById("player");

const button = document.getElementById("playButton");

button.addEventListener("click", async function() {

    if (video.paused) {

        try {
            await video.play();
        } catch (error) {
            alert("ویدیو قابل پخش نیست. لینک ویدیو را بررسی کنید.");
        }

    } else {

        video.pause();

    }

});

video.addEventListener("play", function() {
    button.textContent = "Ⅱ";
    button.setAttribute("aria-label", "توقف ویدیو");
});

video.addEventListener("pause", function() {
    button.textContent = "▶";
    button.setAttribute("aria-label", "پخش ویدیو");
});

video.addEventListener("ended", function() {
    button.textContent = "▶";
});

</script>

</body>
</html>
